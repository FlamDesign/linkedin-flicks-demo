<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flicks on LinkedIn: Concept Demo</title>
<meta name="description" content="Concept demo by Flam: Flicks across LinkedIn ad formats.">
<style>
:root{
  --li-font:-apple-system,system-ui,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","Fira Sans",Ubuntu,Oxygen,"Oxygen Sans",Cantarell,"Droid Sans","Apple Color Emoji","Segoe UI Emoji","Segoe UI Emoji","Segoe UI Symbol","Lucida Grande",Helvetica,Arial,sans-serif;
  --bg:#f4f2ee; --card:#fff; --line:rgba(140,140,140,.2); --t1:rgba(0,0,0,.9); --t2:rgba(0,0,0,.6); --t3:rgba(0,0,0,.45);
  --blue:#0a66c2; --blue-d:#004182; --green:#01754f; --red:#cb112d; --hover:rgba(0,0,0,.08);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--li-font);font-size:14px;color:var(--t1);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
.view{display:none;min-height:100vh}
.view.on{display:block}
.card{background:var(--card);border-radius:8px;box-shadow:0 0 0 1px var(--line)}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Flick slot ---------- */
.flick{position:relative;overflow:hidden;background:#e9e5df;width:100%;aspect-ratio:var(--ar,1/1)}
.flick iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.fstate{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;transition:opacity .4s;background:inherit}
.fstate.hide{opacity:0}
.fstate.load::after{content:"";width:26px;height:26px;border-radius:50%;border:3px solid rgba(0,0,0,.12);border-top-color:var(--blue);animation:spin .9s linear infinite}
.flick.dark,.flick.dark .fstate{background:#0d0d0f}
.flick.dark .fstate.load::after{border-color:#2a2a2a;border-top-color:#9cc7f2}
.fstate.err{background:#2b1414;color:#ffd9d4;pointer-events:auto;padding:18px;text-align:center;font-size:12px;line-height:1.5}
.fstate.err b{display:block;font-size:14px;margin-bottom:6px;color:#fff}
.fwarn{position:absolute;left:8px;bottom:8px;font-size:11px;background:#fff6db;color:#7a5600;border-radius:999px;padding:3px 9px;pointer-events:none;z-index:2}

/* ---------- global nav ---------- */
.gnav{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid rgba(0,0,0,.08);height:52px}
.gnav-in{max-width:1128px;margin:0 auto;height:100%;display:flex;align-items:center;padding:0 12px}
.gnav .logo{flex:none;display:block;width:34px;height:34px;margin-right:8px}
.gsearch{display:flex;align-items:center;gap:8px;width:280px;height:34px;border-radius:999px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.6);padding:0 14px;color:var(--t2)}
.gsearch input{border:0;outline:0;background:none;font:inherit;width:100%;color:var(--t1)}
.gsearch input::placeholder{color:var(--t2)}
.gitems{margin-left:auto;display:flex;height:100%}
.gi{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:80px;height:100%;color:var(--t2);font-size:12px;line-height:1.3;gap:2px}
.gi:hover{color:var(--t1)}
.gi.on{color:var(--t1);box-shadow:inset 0 -2px 0 var(--t1)}
.gi svg{display:block}
.gi .bdg{position:absolute;top:2px;left:calc(50% + 3px);min-width:17px;height:17px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center;padding:0 4px;box-shadow:0 0 0 2px #fff}
.gi .me{width:24px;height:24px;border-radius:50%;overflow:hidden}
.gsep{width:1px;background:rgba(0,0,0,.08);margin:0 6px}
.caret{display:inline-flex;align-items:center;gap:2px}

/* ---------- feed layout ---------- */
.layout{max-width:1128px;margin:0 auto;padding:24px 12px 120px;display:grid;grid-template-columns:225px minmax(0,555px) 300px;gap:24px;justify-content:center}
.lrail>.card,.rrail>.card{margin-bottom:8px;overflow:hidden}
.pcard .cover{height:56px;background:linear-gradient(120deg,#304a62,#5c7f99 55%,#a8bfd0)}
.pcard .av{width:72px;height:72px;border-radius:50%;margin:-36px 0 0 16px;border:2px solid #fff;overflow:hidden;background:#fff}
.pcard .who{padding:10px 16px 14px}
.pcard .nm{font-size:18px;font-weight:600;display:flex;align-items:center;gap:6px}
.pcard .hl{font-size:12px;color:var(--t1);margin-top:4px;line-height:1.35}
.pcard .loc{font-size:12px;color:var(--t2);margin-top:4px}
.pcard .co{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;margin-top:10px}
.lbox{padding:12px 16px}
.lbox h4{margin:0;font-size:14px;font-weight:600;display:flex;justify-content:space-between}
.stat{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:8px 0}
.stat b{color:var(--blue);font-size:14px}
.stat+.stat{border-top:1px solid rgba(0,0,0,.08)}
.lnk{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:600;padding:8px 0}
.lnk+.lnk{border-top:1px solid rgba(0,0,0,.08)}

/* share box */
.share{padding:12px 16px 4px}
.share .row{display:flex;gap:8px;align-items:center}
.share .sav{width:48px;height:48px;border-radius:50%;overflow:hidden;flex:none}
.share .inp{flex:1;height:48px;border-radius:999px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.4);display:flex;align-items:center;padding:0 16px;font-weight:600;color:var(--t2)}
.share .acts{display:flex;justify-content:space-around;padding:4px 0}
.share .acts span{display:flex;align-items:center;gap:8px;padding:12px 8px;font-weight:600;color:var(--t2);font-size:14px}
.sortby{display:flex;align-items:center;gap:8px;margin:2px 0 8px;font-size:12px;color:var(--t2)}
.sortby hr{flex:1;border:0;border-top:1px solid rgba(0,0,0,.15);margin:0}
.sortby b{color:var(--t1)}

/* post */
.post{margin-bottom:8px;overflow:hidden}
.ctxline{display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid rgba(0,0,0,.08);font-size:12px;color:var(--t2)}
.ctxline .sm{width:20px;height:20px;border-radius:50%;overflow:hidden;flex:none}
.ctxline b{color:var(--t1);font-weight:600}
.ctxline .x{margin-left:auto;display:flex;gap:10px;color:var(--t2)}
.phead{display:flex;gap:8px;padding:12px 16px 0}
.phead .lg{width:48px;height:48px;flex:none;overflow:hidden}
.phead .lg.round{border-radius:50%}
.phead .meta{flex:1;min-width:0;line-height:1.3}
.phead .meta .n{font-weight:600;font-size:14px;display:flex;align-items:center;gap:4px}
.phead .meta .n small{font-weight:400;color:var(--t2)}
.phead .meta .s{font-size:12px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phead .r{display:flex;align-items:flex-start;gap:4px;color:var(--t2)}
.phead .follow{display:inline-flex;align-items:center;gap:4px;color:var(--blue);font-weight:600;font-size:14px;padding:4px 8px;border-radius:4px}
.phead .follow:hover{background:rgba(10,102,194,.1)}
.icb{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--t2)}
.icb:hover{background:var(--hover)}
.ptext{padding:8px 16px 12px;font-size:14px;line-height:1.43;white-space:pre-line}
.ptext .more{color:var(--t2)}
.ptext .tag{color:var(--blue);font-weight:600}
.vwrap{background:#000;display:flex;justify-content:center;height:600px}
.vwrap .flick{height:100%;width:auto;aspect-ratio:9/16}
.hbar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#eef3f8}
.hbar .t{flex:1;min-width:0}
.hbar .t b{display:block;font-size:14px;font-weight:600;line-height:1.3}
.hbar .t>span{display:block;font-size:12px;color:var(--t2);margin-top:2px}
.hbar .cta{flex:none;height:32px;padding:0 16px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--blue);color:var(--blue);font-weight:600;font-size:14px}
.hbar .cta:hover{background:rgba(10,102,194,.1);box-shadow:inset 0 0 0 2px var(--blue)}
.social{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;font-size:12px;color:var(--t2)}
.social .rx{display:flex;align-items:center;gap:4px}
.rxi{display:flex}
.rxi span{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;margin-right:-3px;box-shadow:0 0 0 1px #fff}
.pact{display:flex;align-items:center;gap:4px;padding:2px 8px 4px;border-top:1px solid rgba(0,0,0,.08)}
.pact button{display:flex;align-items:center;gap:6px;height:44px;padding:0 10px;border-radius:4px;color:var(--t2);font-weight:600;font-size:14px}
.pact button:hover{background:var(--hover)}
.pact .who{width:24px;height:24px;border-radius:50%;overflow:hidden}
.pact .sp{flex:1}

/* in-stream pre-roll */
.istream{position:relative}
.istream .ad-ov{position:absolute;inset:0;pointer-events:none;z-index:3}
.istream .ad-chip{position:absolute;right:12px;top:12px;pointer-events:auto;background:rgba(0,0,0,.72);color:#fff;font-size:12px;font-weight:600;border-radius:4px;padding:3px 8px;display:flex;gap:6px;align-items:center}
.istream .ad-chip i{font-style:normal;font-weight:400;opacity:.85}
.istream .skip{position:absolute;right:0;bottom:64px;pointer-events:auto;background:rgba(0,0,0,.78);color:#fff;font-size:13px;font-weight:600;padding:9px 14px;border-radius:4px 0 0 4px;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.istream .skip[disabled]{opacity:.85;cursor:default;font-weight:400}
.istream .visit{position:absolute;left:12px;bottom:12px;pointer-events:auto;background:#fff;color:#000;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;display:flex;gap:6px;align-items:center}
.istream .prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.25)}
.istream .prog i{display:block;height:100%;width:0;background:#f5c518}
.creatorvid{position:relative;height:100%;aspect-ratio:9/16;background:linear-gradient(170deg,#3b4a5a,#1d2733 55%,#0f141a);color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:18px}
.creatorvid .play{position:absolute;inset:0;display:grid;place-items:center}
.creatorvid .play span{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;backdrop-filter:blur(4px)}
.creatorvid h5{margin:0 0 6px;font-size:20px;line-height:1.25;font-weight:600}
.creatorvid small{opacity:.8}
.creatorvid .again{position:absolute;right:12px;top:12px;font-size:12px;background:rgba(0,0,0,.5);padding:4px 10px;border-radius:999px}

/* right rail */
.news{padding:12px 16px 8px}
.news h4{margin:0 0 4px;font-size:16px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.news .sub{font-size:14px;color:var(--t2);font-weight:600;margin:6px 0 4px}
.news .it{padding:6px 0}
.news .it b{display:block;font-size:14px;font-weight:600;line-height:1.3}
.news .it span{font-size:12px;color:var(--t2)}
.news .showmore{display:inline-flex;align-items:center;gap:4px;color:var(--t2);font-weight:600;padding:8px 0}
.spot{padding:10px 14px 16px;text-align:center}
.spot .top{display:flex;justify-content:flex-end;align-items:center;gap:6px;font-size:12px;color:var(--t2)}
.spot .top b{font-weight:600;color:var(--t1)}
.spot .msg{font-size:12px;color:var(--t2);margin:2px 8px 10px;line-height:1.35}
.spot .pair{display:flex;justify-content:center;align-items:center;margin-bottom:10px}
.spot .pair>*{width:60px;height:60px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 3px #fff}
.spot .pair>*+*{margin-left:-12px;border-radius:6px;width:52px;height:52px}
.spot .flick{border-radius:6px;margin:0 auto 10px}
.spot .hl{font-size:16px;line-height:1.3;color:var(--t1);margin:0 6px 6px}
.spot .vn{font-size:12px;color:var(--t2);margin-bottom:12px}
.spot .vn b{color:var(--t1)}
.spot .cta{height:34px;padding:0 18px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--blue);color:var(--blue);font-weight:600;font-size:16px}
.spot .cta:hover{background:rgba(10,102,194,.1)}
.foot{padding:8px 16px 0;text-align:center;font-size:12px;color:var(--t2);line-height:2}
.foot span{margin:0 6px;white-space:nowrap}
.foot .brand{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--t1);margin-top:4px}

/* messaging dock + overlay */
.dock{position:fixed;right:24px;bottom:0;width:288px;z-index:50;background:#fff;border-radius:10px 10px 0 0;box-shadow:0 0 0 1px rgba(0,0,0,.15),0 4px 12px rgba(0,0,0,.15)}
.dock .bar{display:flex;align-items:center;gap:8px;height:48px;padding:0 10px 0 12px;cursor:pointer}
.dock .bar .av{width:32px;height:32px;border-radius:50%;overflow:hidden;position:relative}
.dock .bar .on{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 0 2px #fff}
.dock .bar b{font-weight:600;font-size:14px}
.dock .bar .bdg{background:var(--red);color:#fff;border-radius:999px;font-size:11px;font-weight:600;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
.dock .bar .ics{margin-left:auto;display:flex;gap:4px;color:var(--t2)}
.dock .list{display:none;max-height:420px;overflow-y:auto;border-top:1px solid rgba(0,0,0,.08)}
.dock.open .list{display:block}
.thr{display:flex;gap:10px;width:100%;text-align:left;padding:12px;border-bottom:1px solid rgba(0,0,0,.06)}
.thr:hover{background:rgba(0,0,0,.04)}
.thr.cur{background:#ebf4fd;box-shadow:inset 3px 0 0 var(--blue)}
.thr .tav{width:48px;height:48px;border-radius:50%;overflow:hidden;flex:none}
.thr .tav.sq{border-radius:4px}
.thr .tt{flex:1;min-width:0}
.thr .tt .row{display:flex;justify-content:space-between;gap:8px}
.thr .tt b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thr .tt small{font-size:12px;color:var(--t2);flex:none}
.thr .tt p{margin:2px 0 0;font-size:14px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thr .tt .sp{font-size:12px;color:var(--t2)}
.thr.unread .tt b,.thr.unread .tt p{color:var(--t1);font-weight:600}
.cwin{position:fixed;right:328px;bottom:0;width:500px;height:min(700px,calc(100vh - 70px));z-index:51;background:#fff;border-radius:10px 10px 0 0;box-shadow:0 0 0 1px rgba(0,0,0,.15),0 4px 16px rgba(0,0,0,.2);display:none;flex-direction:column}
.cwin.on{display:flex}
.cwin .wh{display:flex;align-items:center;gap:10px;height:48px;padding:0 8px 0 12px;border-bottom:1px solid rgba(0,0,0,.08);flex:none}
.cwin .wh .lg{width:32px;height:32px;border-radius:4px;overflow:hidden}
.cwin .wh b{font-weight:600;flex:1}
.cwin .wh .ics{display:flex;gap:2px}

/* conversation / message ad body (shared by dock window + inbox) */
.cv{flex:1;overflow-y:auto;scroll-behavior:smooth}
.cv .spbar{display:flex;justify-content:space-between;font-size:12px;color:var(--t2);padding:6px 16px;background:#f3f6f8}
.cv .who{padding:14px 16px 8px}
.cv .who .lg{width:72px;height:72px;overflow:hidden;border-radius:4px}
.cv .who b{display:block;font-size:16px;font-weight:600;margin-top:8px}
.cv .day{display:flex;align-items:center;gap:10px;margin:6px 16px;font-size:12px;font-weight:600;color:var(--t2);letter-spacing:.04em}
.cv .day::before,.cv .day::after{content:"";flex:1;border-top:1px solid rgba(0,0,0,.08)}
.cmsg{display:flex;gap:8px;padding:8px 16px}
.cmsg .ma{width:32px;height:32px;flex:none;overflow:hidden;border-radius:4px}
.cmsg .ma.round{border-radius:50%}
.cmsg .mb{flex:1;min-width:0}
.cmsg .mb .mh{font-size:14px;font-weight:600}
.cmsg .mb .mh small{font-weight:400;color:var(--t2)}
.cmsg .mb p{margin:4px 0 0;font-size:14px;line-height:1.43}
.cmsg .mb ul{margin:6px 0 0;padding-left:18px;line-height:1.5}
.cmsg .mf{margin-top:10px;width:min(260px,100%);border-radius:8px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.1)}
.cmsg .mf.sq{width:min(300px,100%)}
.cmsg .mf .cap{display:flex;justify-content:space-between;gap:6px;font-size:12px;padding:6px 10px;background:#f3f6f8;color:var(--t2)}
.cmsg .mf .cap b{color:var(--t1);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:6px 16px 16px 56px}
.chips button{min-height:32px;padding:4px 16px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--blue);color:var(--blue);font-weight:600;font-size:16px;line-height:1.3}
.chips button:hover{background:rgba(10,102,194,.1);box-shadow:inset 0 0 0 2px var(--blue)}
.chips button.pri{background:var(--blue);color:#fff}
.chips button.pri:hover{background:var(--blue-d)}
.cmsg.me .mb .mh{color:var(--t1)}
.cv .typing{display:inline-flex;gap:4px;padding:6px 0}
.cv .typing i{width:6px;height:6px;border-radius:50%;background:#999;animation:blink 1.2s infinite}
.cv .typing i:nth-child(2){animation-delay:.2s}.cv .typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* messaging page */
#v-msg{background:var(--bg)}
.mlay{max-width:1128px;margin:0 auto;padding:24px 12px 40px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px}
.mbox{display:grid;grid-template-columns:360px minmax(0,1fr);height:calc(100vh - 100px);min-height:560px;overflow:hidden}
.mbox .mleft{border-right:1px solid rgba(0,0,0,.08);display:flex;flex-direction:column;min-height:0}
.mbox .mtop{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 10px 16px;border-bottom:1px solid rgba(0,0,0,.08)}
.mbox .mtop b{font-size:16px;font-weight:600}
.mbox .msearch{margin:8px 12px;display:flex;align-items:center;gap:8px;height:34px;border-radius:4px;background:#edf3f8;padding:0 10px;color:var(--t2)}
.mbox .mtabs{display:flex;gap:6px;padding:4px 12px 10px;border-bottom:1px solid rgba(0,0,0,.08)}
.mbox .mtabs span{height:32px;padding:0 12px;border-radius:999px;display:inline-flex;align-items:center;font-weight:600;color:var(--t2);box-shadow:inset 0 0 0 1px rgba(0,0,0,.4)}
.mbox .mtabs span.on{background:var(--green);color:#fff;box-shadow:none}
.mbox .mlist{flex:1;overflow-y:auto}
.mbox .mright{display:flex;flex-direction:column;min-height:0}
.mbox .mrh{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;border-bottom:1px solid rgba(0,0,0,.08)}
.mbox .mrh b{font-size:14px;font-weight:600;flex:1}
.compan{padding:10px}
.compan .top{display:flex;justify-content:space-between;font-size:12px;color:var(--t2);padding:0 2px 8px}
.compan .flick{border-radius:4px}
.compan .cap{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 2px 2px}
.compan .cap .t b{display:block;font-size:14px;font-weight:600}
.compan .cap .t span{font-size:12px;color:var(--t2)}
.compan .cap button{height:30px;padding:0 14px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--blue);color:var(--blue);font-weight:600}
.msgcta{margin:10px 0 2px;height:36px;padding:0 18px;border-radius:999px;background:var(--blue);color:#fff;font-weight:600;font-size:16px}
.msgcta:hover{background:var(--blue-d)}

/* mobile view */
#v-mobile{background:#dcd9d3;padding:28px 12px 80px}
.phone{width:390px;max-width:100%;height:min(844px,calc(100vh - 56px));margin:0 auto;border-radius:44px;background:#111;padding:12px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.screen{width:100%;height:100%;border-radius:34px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.sbar{height:40px;flex:none;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:14px;font-weight:600}
.mhdr{height:48px;flex:none;background:#fff;display:flex;align-items:center;gap:14px;padding:0 12px;border-bottom:1px solid rgba(0,0,0,.08)}
.mhdr .logo{width:30px;height:30px}
.mhdr .sp{flex:1}
.mhdr .ma{width:28px;height:28px;border-radius:50%;overflow:hidden}
.mscroll{flex:1;overflow-y:auto;scrollbar-width:none}
.mscroll::-webkit-scrollbar{display:none}
.mscroll .post{border-radius:0;box-shadow:none;margin-bottom:8px}
.mscroll .phead{padding:12px 12px 0}
.mscroll .phead .lg{width:40px;height:40px}
.mscroll .ptext{padding:8px 12px 10px}
.mscroll .vwrap{height:auto}
.mscroll .vwrap .flick{width:100%;height:auto}
.mscroll .hbar{padding:10px 12px}
.mscroll .pact{justify-content:space-between;padding:0 6px}
.mscroll .pact button{flex-direction:column;gap:2px;height:52px;font-size:12px;padding:0 8px}
.mnavb{height:56px;flex:none;background:#fff;border-top:1px solid rgba(0,0,0,.08);display:flex;justify-content:space-around;align-items:center;font-size:11px;color:var(--t2)}
.mnavb span{display:flex;flex-direction:column;align-items:center;gap:2px}
.mnavb span.on{color:var(--t1)}

/* ---------- ad selector ---------- */
.gpill{position:fixed;right:24px;bottom:64px;z-index:90;display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:999px;background:#1b1f23;color:#f2f2f2;font-weight:600;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.gpill:hover{background:#2a2f34}
.gpill i{font-style:normal;background:var(--blue);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px}
.no-dock .gpill{bottom:20px}
.gscrim{position:fixed;inset:0;z-index:88;display:none}
.gscrim.on{display:block}
.gpanel{position:fixed;right:24px;bottom:114px;z-index:89;width:320px;max-height:min(70vh,640px);overflow-y:auto;background:#1b1f23;color:#f2f2f2;border-radius:16px;box-shadow:0 16px 40px rgba(0,0,0,.45);padding:6px 6px 8px;display:none;scrollbar-width:thin}
.no-dock .gpanel{bottom:70px}
.gpanel.on{display:block}
.gpanel h6{margin:10px 10px 4px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#9aa1a8}
.gitem{display:flex;gap:10px;align-items:center;width:100%;text-align:left;min-height:36px;padding:6px 10px;border-radius:8px;font-size:13px;line-height:1.3}
.gitem:hover{background:#2c3238}
.gitem.cur{background:#21364d}
.gitem .n{width:20px;flex:none;color:#9aa1a8;font-size:12px;font-variant-numeric:tabular-nums}
.gitem .b{margin-left:auto;font-size:11px;color:#9aa1a8;flex:none}
.pulse{animation:pulse 2.2s ease-out 1}
@keyframes pulse{0%{box-shadow:0 0 0 0 #f5c518}15%{box-shadow:0 0 0 4px #f5c518}100%{box-shadow:0 0 0 4px transparent}}

/* ---------- leaving sheet, lead form, toast ---------- */
.scrim{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.6);display:none;place-items:center;padding:16px}
.scrim.on{display:grid}
.sheet{width:min(552px,100%);background:#fff;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
.sheet .sh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 14px 24px;border-bottom:1px solid rgba(0,0,0,.08)}
.sheet .sh h3{margin:0;font-size:20px;font-weight:600}
.sheet .sb{padding:16px 24px}
.sheet .sb p{margin:0 0 10px;font-size:16px;line-height:1.5}
.sheet .url{font-size:14px;color:var(--t2);word-break:break-all}
.sheet .sf{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid rgba(0,0,0,.08)}
.sheet .sf>*{height:32px;padding:0 16px;border-radius:999px;font-weight:600;font-size:16px;display:inline-flex;align-items:center}
.sheet .stay{box-shadow:inset 0 0 0 1px var(--blue);color:var(--blue)}
.sheet .go{background:var(--blue);color:#fff}
.lgf .sb{max-height:min(60vh,520px);overflow-y:auto}
.lgf .brand{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.lgf .brand .lg{width:48px;height:48px;border-radius:4px;overflow:hidden}
.lgf .brand b{display:block;font-size:16px}
.lgf .brand span{font-size:12px;color:var(--t2)}
.sheet .sb p.lead{font-size:14px;color:var(--t2);margin:0 0 14px}
.lgf .me{display:flex;gap:10px;align-items:center;padding:10px 0 14px;border-bottom:1px solid rgba(0,0,0,.08);margin-bottom:12px}
.lgf .me .a{width:40px;height:40px;border-radius:50%;overflow:hidden}
.lgf label{display:block;font-size:14px;color:var(--t2);margin:10px 0 4px}
.lgf input,.lgf select{width:100%;height:36px;border-radius:4px;border:1px solid rgba(0,0,0,.6);padding:0 10px;font:inherit;font-size:14px;color:var(--t1);background:#fff}
.sheet .sb p.fine{font-size:12px;color:var(--t2);margin-top:14px;line-height:1.45}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:96;background:#1b1f23;color:#fff;font-weight:600;font-size:14px;padding:10px 16px;border-radius:8px;transition:all .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}

/* responsive */
@media (max-width:480px){ .layout .pact button span{display:none} .layout .pact button{padding:0 12px} }
@media (max-width:1180px){ .cwin{right:24px;bottom:56px;height:min(640px,calc(100vh - 120px))} }
@media (max-width:1100px){
  .layout{grid-template-columns:225px minmax(0,555px)}
  .rrail{display:none}
  .gsearch{width:200px}
}
@media (max-width:860px){
  .layout{grid-template-columns:minmax(0,555px);padding-top:12px}
  .lrail{display:none}
  .gitems .gi:not(.keep){display:none}
  .gsearch{flex:1;width:auto}
  .mlay{grid-template-columns:1fr}
  .mlay>aside{display:none}
  .mbox{grid-template-columns:1fr}
  .mbox .mleft{display:none}
  .cwin{left:8px;right:8px;width:auto}
  .vwrap{height:520px}
  .gpanel{right:12px;left:12px;width:auto}
}

/* ================= Flick slots ================= */
let SLOTS = {};
function flick(id, brand, cls=""){
  SLOTS[id] = { brand, ready:false, error:false, lastCta:0, variant:0, timer:null, mounted:false };
  const b=BRANDS[brand];
  return `<div class="flick fl-${brand} ${b.dark?"dark":""} ${cls}" data-slot="${id}" style="--ar:${b.ar}"><div class="fstate load"></div></div>`;
}
function variantOf(id){ const s=SLOTS[id], b=BRANDS[s.brand]; return b.variants[s.variant] || b.variants[0]; }
function shop(id){ const s=SLOTS[id]; if(!s) return; openSheet(variantOf(id).url || BRANDS[s.brand].url); }
const onSwitch = {};
function syncVariant(id){
  const s=SLOTS[id]; if(!s) return;
  document.querySelectorAll(`[data-vname="${id}"]`).forEach(el=>el.textContent = variantOf(id).n);
  if(onSwitch[id]) onSwitch[id](s.variant);
}
const LIVE_SEL = ".view.on .flick[data-slot], .cwin.on .flick[data-slot]";
let io = null;
function observeFlicks(){
  if(io) io.disconnect();
  io = new IntersectionObserver(entries=>{ entries.forEach(en=>{ en.isIntersecting ? mount(en.target) : unmount(en.target); }); }, { rootMargin:"700px 0px 700px 0px" });
  document.querySelectorAll(LIVE_SEL).forEach(h=>io.observe(h));
  requestAnimationFrame(mountVisible); setTimeout(mountVisible, 80);
}
function mountVisible(){
  document.querySelectorAll(LIVE_SEL).forEach(h=>{
    const r=h.getBoundingClientRect();
    if(r.width && r.bottom > -700 && r.top < innerHeight+700) mount(h);
  });
}
setInterval(mountVisible, 1500);
function mount(host){
  const id=host.dataset.slot, s=SLOTS[id]; if(!s || s.mounted) return;
  s.mounted=true; s.ready=false; s.error=false;
  const f=document.createElement("iframe");
  f.title=`${BRANDS[s.brand].name} Flick: interactive video`; f.setAttribute("allow","autoplay; fullscreen"); f.setAttribute("scrolling","no");
  f.srcdoc=tagDoc(id, BRANDS[s.brand]);
  host.prepend(f);
  s.timer=setTimeout(()=>{
    if(s.ready||s.error||!s.mounted) return;
    host.querySelector(".fstate")?.classList.add("hide");
    if(!host.querySelector(".fwarn")) host.insertAdjacentHTML("beforeend",`<span class="fwarn">No ready signal from Flick yet</span>`);
    console.warn("[flicks] no vertex-ready from", id, BRANDS[s.brand].src);
  },9000);
}
function unmount(host){
  const id=host.dataset.slot, s=SLOTS[id]; if(!s || !s.mounted || s.error) return;
  clearTimeout(s.timer); s.mounted=false; s.ready=false; s.variant=0;
  host.querySelector("iframe")?.remove(); host.querySelector(".fwarn")?.remove();
  const st=host.querySelector(".fstate"); if(st) st.className="fstate load";
  syncVariant(id);
}
window.addEventListener("message", e=>{
  const m=e.data; if(!m || m.flam!==1) return;
  const s=SLOTS[m.slot]; if(!s) return;
  const host=document.querySelector(`.flick[data-slot="${m.slot}"]`);
  if(!host || e.source!==host.querySelector("iframe")?.contentWindow) return;
  if(m.type==="ready"){ s.ready=true; clearTimeout(s.timer); host.querySelector(".fstate")?.classList.add("hide"); host.querySelector(".fwarn")?.remove(); if(onReady[m.slot]) onReady[m.slot](); }
  else if(m.type==="warn"){ console.info("[flicks] recovered warning", m.slot, m.msg); }
  else if(m.type==="error"){
    s.error=true; clearTimeout(s.timer); console.error("[flicks] render error", m.slot, m.msg);
    const st=host.querySelector(".fstate"); st.className="fstate err";
    st.innerHTML=`<div><b>Flick failed to load</b>${esc(m.msg)}<br><br>If this file is open inside a preview window, open it directly in Chrome. Previews block ad scripts.</div>`;
  }
  else if(m.type==="switch"){ s.variant=Math.max(0,Math.min(m.diff, BRANDS[s.brand].variants.length-1)); syncVariant(m.slot); }
  else if(m.type==="cta"){
    // Creatives can fire the CTA up to three ways, sometimes first with an unfilled macro; act once, prefer a real URL.
    const real = /^https?:\/\//.test(m.url||"") && !/\$\{/.test(m.url) ? m.url : "";
    const now=Date.now();
    if(now-s.lastCta<900){ if(real && s.ctaFallback){ s.ctaFallback=false; openSheet(real); } return; }
    s.lastCta=now; s.ctaFallback=!real;
    openSheet(real || variantOf(m.slot).url || BRANDS[s.brand].url);
  }
});
const onReady = {};

      <span class="prog"><i id="is-prog"></i></span></div>`;
}
function startPreroll(){
  clearInterval(IS.t); IS.left=15; IS.done=false;
  const el=document.getElementById("is-left"), sk=document.getElementById("is-skip"), pr=document.getElementById("is-prog");
  IS.t=setInterval(()=>{
    if(!document.getElementById("is-left")){ clearInterval(IS.t); return; }
    const sw=SLOTS["is-acer"]; if(!sw||!sw.mounted) return;
    IS.left=Math.max(0,IS.left-1); const el2=document.getElementById("is-left"); el2.textContent="0:"+String(IS.left).padStart(2,"0");
    const p=document.getElementById("is-prog"); p.style.width=((15-IS.left)/15*100)+"%";
    const s=document.getElementById("is-skip"); const el3=15-IS.left;
    if(el3>=IS.skipAt){ s.disabled=false; s.textContent="Skip ad ›"; } else { s.textContent="Video in "+(IS.skipAt-el3); }
    if(IS.left===0) clearInterval(IS.t);
  },1000);
}
onReady["is-acer"] = ()=>{ if(!IS.done) startPreroll(); };
function skipPreroll(){
  clearInterval(IS.t); IS.done=true;
  const host=document.querySelector('.flick[data-slot="is-acer"]'); if(host) unmount(host);
  delete SLOTS["is-acer"];
  document.getElementById("istream").innerHTML = `<div class="creatorvid"><button class="again" onclick="replayPreroll()">Replay ad</button><div class="play"><span>${IC.play}</span></div><h5>3 habits that cut my meetings in half</h5><small>Priya Nair · creator video plays here</small></div>`;
}
function replayPreroll(){

}

const CONVO_INTRO = () => `Hi ${ME.first}, refreshing laptops for your team this year? Tap through three Acer models in the video, then pick what you'd like to do next.`;
function convoStart(slot){
  return `<div class="spbar"><span>Sponsored</span><span>Nov 2</span></div>

      <div class="mf">${flick(slot,"acer")}<div class="cap"><span>Showing</span><b data-vname="${slot}">${BRANDS.acer.variants[0].n}</b></div></div></div></div>
    <div class="cmsg" id="${slot}-anchor" style="display:none"></div>
    <div class="chips" id="${slot}-chips">${chipsFor(slot,"start")}</div>`;
}
function chipsFor(slot, step){
  const buy = `<button class="pri" onclick="convoPick('${slot}','buy')">Buy the <span data-vname="${slot}">${variantOf(slot)?.n || BRANDS.acer.variants[0].n}</span></button>`;
  const cmp = `<button onclick="convoPick('${slot}','compare')">Compare the three</button>`;
  const quote = `<button onclick="convoPick('${slot}','quote')">Get a business quote</button>`;
  const no = `<button onclick="convoPick('${slot}','no')">Not interested</button>`;
  if(step==="start") return buy+cmp+quote+no;
  if(step==="compare") return buy+quote;
  if(step==="quoted") return buy;
  return "";
}
function convoAppend(slot, html, me){
  const chips=document.getElementById(slot+"-chips"); if(!chips) return;
  const d=document.createElement("div"); d.className="cmsg"+(me?" me":"");
  d.innerHTML = me ? `<span class="ma round">${ME_AV()}</span><div class="mb"><div class="mh">${ME.name} <small>· now</small></div><p>${html}</p></div>`
                   : `<span class="ma">${LG.acer}</span><div class="mb"><div class="mh">Acer for Business <small>· now</small></div>${html}</div>`;
  chips.parentNode.insertBefore(d, chips);
  const sc=chips.closest(".cv"); if(sc) setTimeout(()=>sc.scrollTop=sc.scrollHeight,30);
}
function convoPick(slot, k){
  const chips=document.getElementById(slot+"-chips"); const v=variantOf(slot).n;
  if(k==="buy"){ convoAppend(slot,`Buy the ${esc(v)}`,true); chips.innerHTML=""; setTimeout(()=>{ convoAppend(slot,`<p>Here's the ${esc(v)} on the Acer Store.</p>`); chips.innerHTML=chipsFor(slot,"quoted"); shop(slot); },500); return; }
  if(k==="compare"){ convoAppend(slot,"Compare the three",true); chips.innerHTML="";
    setTimeout(()=>{ convoAppend(slot,`<p>Quick guide to the three in the video:</p><ul><li><b>Predator Helios Neo 16 AI</b>: for heavy creative, 3D and gaming work</li><li><b>Acer Chromebook 314</b>: light and simple for frontline and shared desks</li><li><b>Nitro V 16 AI</b>: strong performance at a lower price</li></ul><p style="margin-top:6px">Tap any of them in the video above to see it again.</p>`); chips.innerHTML=chipsFor(slot,"compare"); },600); return; }
  if(k==="quote"){ convoAppend(slot,"Get a business quote",true); chips.innerHTML=""; setTimeout(()=>{ openLead(slot); chips.innerHTML=chipsFor(slot,"compare"); },400); return; }
  if(k==="no"){ convoAppend(slot,"Not interested",true); chips.innerHTML=""; setTimeout(()=>convoAppend(slot,`<p>Thanks for letting us know, ${ME.first}. We won't send you this message again.</p>`),500); }
}

    ["Video ad, vertical","#/feed","feed-acer","Acer"],
    ["Thought Leader ad","#/feed","feed-cross","Cross"],
    ["Video ad, square","#/feed","feed-amex","Amex"],

  ["Messaging", [
    ["Message ad with companion banner","#/messaging/cross","msg-cross","Cross"],
    ["Conversation ad with lead gen form","#/messaging/acer","msg-acer","Acer"]]],
  ["Mobile app", [
    ["Video ad, square","#/mobile","m-amex","Amex"],
    ["Video ad, vertical","#/mobile","m-acer","Acer"],
    ["Thought Leader ad","#/mobile","m-cross","Cross"]]]
];
function renderGuide(){
  let n=0;
  document.getElementById("gpanel").innerHTML = GUIDE.map(([g,items])=>`<h6>${g}</h6>`+items.map(([t,h,a,b])=>`<button class="gitem" data-h="${h}" onclick="jump('${h}','${a}')"><span class="n">${++n}</span>${t}<span class="b">${b}</span></button>`).join("")).join("");
  document.getElementById("gcount").textContent=n;
}
function toggleGuide(force){
  const p=document.getElementById("gpanel"), on = typeof force==="boolean" ? force : !p.classList.contains("on");
  p.classList.toggle("on",on); document.getElementById("gscrim").classList.toggle("on",on);
  document.getElementById("gpill").setAttribute("aria-expanded", on);
}
let pendingAnchor=null;
function jump(h,a){
  toggleGuide(false); pendingAnchor=a;
  if(location.hash===h) focusAnchor(); else location.hash=h;
}
function focusAnchor(){
  if(!pendingAnchor) return; const a=pendingAnchor; pendingAnchor=null;
  setTimeout(()=>{
    if(a==="@convo"){ openConvo(); const w=document.getElementById("cwin"); w.classList.remove("pulse"); void w.offsetWidth; w.classList.add("pulse"); return; }
    const el=document.querySelector(`.view.on [data-anchor="${a}"]`); if(!el) return;
    const ph=el.closest(".mscroll");
    if(ph){ ph.scrollTo({top:el.offsetTop-ph.offsetTop-8,behavior:"smooth"}); }
    else el.scrollIntoView({behavior:"smooth", block: el.offsetHeight > innerHeight-80 ? "start" : "center"});
    if(!ph && el.offsetHeight > innerHeight-80) setTimeout(()=>scrollBy({top:-64}),450);
    el.classList.remove("pulse"); void el.offsetWidth; el.classList.add("pulse");
  }, 250);
}

/* =====================================================================
   Router
   ===================================================================== */
function route(){
  const h=location.hash||"#/feed";
  const path=h.slice(1);
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("on"));
  document.querySelectorAll(".gitem").forEach(el=>el.classList.toggle("cur", el.dataset.h==="#"+path));
  if(document.getElementById("cwin").classList.contains("on")) closeConvo();
  closeLead(); closeSheet();
  document.body.classList.toggle("no-dock", !path.startsWith("/feed"));
  if(path.startsWith("/messaging")){ document.getElementById("v-msg").classList.add("on"); renderMessaging(path.split("/")[2]); scrollTo(0,0); }
  else if(path==="/mobile"){ document.getElementById("v-mobile").classList.add("on"); renderMobile(); scrollTo(0,0); }
  else { document.getElementById("v-feed").classList.add("on"); renderFeed(); scrollTo(0,0); }
  focusAnchor();
}
addEventListener("hashchange", route);
renderGuide(); route();
